[package]
name = "amemory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Amemory + XERJ unified knowledge, memory, and MCP server"

[lib]
name = "amemory"
path = "src/lib.rs"

[[bin]]
name = "amemory"
path = "src/main.rs"

[dependencies]
amemory-adapter = { path = "crates/adapter" }
amemory-domain = { path = "crates/domain" }
amemory-mcp = { path = "crates/mcp" }
color-eyre.workspace = true
eyre.workspace = true
serde.workspace = true
tokio.workspace = true
toolkit-rs.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/mcp",
    "crates/adapter",
]
exclude = ["crates/xerj", "crates/xerj/engine"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Amemory Contributors"]

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
base64 = "0.23.1"
blake3 = "1.8.7"
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
eyre = "0.6.14"
rmcp = { version = "3.9.0", features = [
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toolkit-rs = "1.0.31"
tower-http = { version = "0.5", features = ["limit"] }
tracing = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
