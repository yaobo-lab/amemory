[package]
name = "memvid-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Model Context Protocol server for Memvid memory stores"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/mystique09/memvid-mcp"

[dependencies]
memvid-core = "2.0.140"
rmcp = { version = "3.8.0", features = [
    "transport-io",
    "transport-streamable-http-server",
] }
tokio = { version = "1.54.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
] }
axum = "0.8"
eyre = "0.6.14"
color-eyre = "0.6.5"
toolkit-rs = "1.0.31"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_crate_dependencies = "warn"

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
