<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">学习 AI 的信心曲线</title>
  <desc id="desc">展示从提示词入门、模型原理、AI 应用系统到生产价值的能力与信心变化。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#f4f8f8"/>
    </linearGradient>
    <linearGradient id="curve" x1="110" y1="640" x2="1170" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f8f89"/>
      <stop offset="0.55" stop-color="#147b78"/>
      <stop offset="1" stop-color="#075f63"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="120" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39a6a0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#39a6a0" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0d4f52" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#263a3c"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; }
      .title { fill: #173b3d; font-size: 32px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { fill: #668082; font-size: 15px; }
      .axis { fill: #263a3c; font-size: 18px; font-weight: 600; }
      .axis-note { fill: #718486; font-size: 13px; }
      .phase { fill: #a85f50; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
      .phase-small { fill: #8a9a9b; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
      .label { fill: #294e57; font-size: 15px; font-weight: 600; }
      .label-light { fill: #557478; font-size: 14px; }
      .callout-title { fill: #173f44; font-size: 15px; font-weight: 700; }
      .callout-body { fill: #587579; font-size: 13px; }
      .divider { stroke: #9badad; stroke-width: 1.5; stroke-dasharray: 7 9; }
      .dot { fill: #ffffff; stroke: #147b78; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="78" y="58" class="title">学习 AI 的信心曲线</text>
  <text x="80" y="86" class="subtitle">从“会聊天”到“持续创造可衡量的价值”</text>

  <!-- Phase background bands -->
  <rect x="110" y="115" width="290" height="525" rx="16" fill="#e9f6f4" opacity="0.52"/>
  <rect x="400" y="115" width="320" height="525" rx="16" fill="#f7f3ed" opacity="0.58"/>
  <rect x="720" y="115" width="310" height="525" rx="16" fill="#edf4f7" opacity="0.62"/>
  <rect x="1030" y="115" width="140" height="525" rx="16" fill="#edf7f1" opacity="0.72"/>

  <!-- Phase separators -->
  <line x1="400" y1="115" x2="400" y2="640" class="divider"/>
  <line x1="720" y1="115" x2="720" y2="640" class="divider"/>
  <line x1="1030" y1="115" x2="1030" y2="640" class="divider"/>

  <!-- Axes -->
  <line x1="110" y1="640" x2="1175" y2="640" stroke="#263a3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="110" y1="640" x2="110" y2="112" stroke="#263a3c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="50" y="365" class="axis" transform="rotate(-90 50 365)">信心</text>

  <text x="110" y="674" class="axis-note">第一次问 AI</text>
  <text x="1084" y="674" class="axis-note">持续复利</text>

  <!-- Area and confidence curve -->
  <path d="M110 640
           C155 632 190 607 220 545
           C250 475 270 330 310 220
           C340 150 370 130 395 200
           C425 270 420 425 465 490
           C500 535 535 450 575 365
           C605 305 630 325 650 405
           C670 475 690 555 720 570
           C750 585 770 490 800 440
           C845 390 885 370 925 315
           C950 275 965 180 985 165
           C1005 150 1015 270 1030 300
           C1050 335 1070 275 1090 195
           C1110 125 1140 95 1170 85
           L1170 640 L110 640 Z" fill="url(#area)"/>
  <path d="M110 640
           C155 632 190 607 220 545
           C250 475 270 330 310 220
           C340 150 370 130 395 200
           C425 270 420 425 465 490
           C500 535 535 450 575 365
           C605 305 630 325 650 405
           C670 475 690 555 720 570
           C750 585 770 490 800 440
           C845 390 885 370 925 315
           C950 275 965 180 985 165
           C1005 150 1015 270 1030 300
           C1050 335 1070 275 1090 195
           C1110 125 1140 95 1170 85" fill="none" stroke="url(#curve)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- Phase 1: AI first contact -->
  <text x="286" y="155" class="phase">愚昧之巅</text>
  <text x="137" y="592" class="label-light">AI 不就是聊天吗？</text>
  <text x="174" y="523" class="label">下载豆包、WorkBddy</text>
  <text x="205" y="445" class="label">帮我做PPT、XX这个怎么做？</text>
  <text x="221" y="370" class="label">使用豆包技能中心</text>
  <text x="120" y="297" class="label">我也会写不就是：角色，背景，要求嘛</text>
  <circle cx="366" cy="155" r="6" class="dot"/>
  <g transform="translate(275 178)">
    <rect width="110" height="48" rx="10" fill="#ffffff" stroke="#cee2df"/>
    <text x="55" y="20" text-anchor="middle" class="callout-title">“我会 AI 了！”</text>
    <text x="55" y="39" text-anchor="middle" class="callout-body">Demo 之巅</text>
  </g>

  <!-- Phase 2: principles and training -->
  <text x="421" y="181" class="label">怎么做出问题这么多？？</text>
  <text x="433" y="207" class="label-light">与我要的，差距这么大</text>
  <text x="425" y="425" class="label">好！！我要求AI重改</text>
  <text x="430" y="450" class="label-light">“使用我写的SKILL”</text>
  <text x="530" y="350" class="label">有效果了！！</text>
  <text x="530" y="375" class="label-light">我感觉我又行了</text>
  <text x="570" y="455" class="label">项目需求复杂度上来了</text>
  <text x="570" y="480" class="label-light">多轮 /没继续了/ AI 不行</text>
  <text x="610" y="614" class="phase">绝望之谷</text>
  <circle cx="720" cy="570" r="6" class="dot"/>

  <!-- Phase 3: AI systems -->
  <text x="741" y="523" class="label">SILL A/B、Plan</text>
  <text x="750" y="548" class="label-light">A/B测试、计划审核</text>
  <text x="786" y="431" class="label">RAG,RAG-WIKi,工作流</text>
  <text x="797" y="456" class="label-light">分块、召回、重排、检索增强</text>
  <text x="858" y="350" class="label">评测与可观测性</text>
  <text x="875" y="375" class="label-light">Guardrails · 安全</text>
  <text x="812" y="300" class="phase">开悟之坡</text>
  <circle cx="985" cy="165" r="6" class="dot"/>
  <g transform="translate(910 90)">
    <rect width="122" height="52" rx="10" fill="#ffffff" stroke="#cee2df"/>
    <text x="61" y="21" text-anchor="middle" class="callout-title">Agent 无所不能？</text>
    <text x="61" y="41" text-anchor="middle" class="callout-body">多智能体峰值</text>
  </g>
  <text x="1060" y="326" class="label" text-anchor="middle">生产现实</text>
  <text x="1080" y="349" class="label-light" text-anchor="middle">延迟 · 稳定性</text>
  <text x="1072" y="369" class="label-light" text-anchor="middle">权限 · 成本</text>

  <!-- Phase 4: value -->
  <text x="1060" y="172" class="phase">永续之原</text>
  <text x="1060" y="465" class="label">数据闭环</text>
  <text x="1060" y="492" class="label">人机协作</text>
  <text x="1060" y="519" class="label">持续迭代</text>
  <text x="1125" y="62" text-anchor="middle" class="callout-title">持续、可靠、可衡量</text>
  <text x="1125" y="82" text-anchor="middle" class="callout-body">从模型能力到业务成果</text>

  <!-- Footer -->
  <text x="80" y="735" class="axis-note">核心转变：会用模型 → 理解模型 → 构建系统 → 解决真实问题</text>
  <text x="1120" y="735" text-anchor="end" class="axis-note">AI Learning Journey</text>
</svg>
