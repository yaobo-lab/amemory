[server]
mode = "mcp-stdio" # 可选: "sync", "mcp-stdio", "mcp-http", "server"
host = "127.0.0.1"
port = 8000
endpoint_path = "/mcp"
allow_remote = false
max_request_body_bytes = 16777216

[storage]
skills = "./resource/skills"
books = "./resource/books"

[xerj]
data_dir = "./data/xerj"
skills_index = "amemory-skills-v1"
books_index = "amemory-books-v1"
memory_index = "amemory-memory-v1"
embed_mode = "lexical"
bind_address = "127.0.0.1"
es_compat_port = 9200
rest_port = 8080
grpc_port = 8081
# hub_api_key = "" # 可选: 也可通过环境变量 XERJ_HUB_API_KEY 设置，配置后自动暴露 xerj_hub_* 工具

[document_import]
allowed_roots = ["./resource/uploads"]
max_file_bytes = 52428800

[logger]
level = "info"

[panic]
